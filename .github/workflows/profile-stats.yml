name: Actualizar estadísticas del perfil

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Generar tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ihackurass&show_icons=true&theme=tokyonight&hide_border=true&locale=es&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ihackurass&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&size_weight=0.5&count_weight=0.5&hide=Rust
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Publicar tarjetas actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: actualizar estadísticas del perfil" || exit 0
          git push
